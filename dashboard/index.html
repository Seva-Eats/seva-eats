<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seva Eats Control Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <div class="grain"></div>

    <main class="shell">
      <header class="hero card">
        <div class="hero-copy">
          <h1>Orders</h1>
        </div>

        <div class="hero-meta">
          <div class="status-pill" id="connectionPill">Disconnected</div>
          <button class="ghost-button" id="refreshButton" type="button">Refresh data</button>
        </div>
      </header>

      <section class="stats">
        <article class="stat card">
          <span class="stat-label">Pending</span>
          <strong id="pendingCount">0</strong>
        </article>
        <article class="stat card">
          <span class="stat-label">Active</span>
          <strong id="activeCount">0</strong>
        </article>
        <article class="stat card">
          <span class="stat-label">Selected</span>
          <strong id="selectedLabel">None</strong>
        </article>
        <article class="stat card">
          <span class="stat-label">Live</span>
          <strong id="realtimeLabel">Idle</strong>
        </article>
      </section>

      <section class="workspace">
        <aside class="sidebar">
          <section class="card control-card">
            <div class="card-head">
              <h2>Controls</h2>
            </div>

            <label class="field">
              <span>Kitchen</span>
              <select id="kitchenSelect"></select>
            </label>

            <label class="field">
              <span>Driver (optional)</span>
              <select id="driverSelect"></select>
            </label>

            <div class="action-row">
              <button class="primary-button" id="refreshControlButton" type="button">Refresh</button>
            </div>
          </section>

          <section class="card list-card">
            <div class="card-head">
              <h2>Queue</h2>
            </div>
            <div id="pendingList" class="stack"></div>
          </section>

          <section class="card list-card">
            <div class="card-head">
              <h2>Deliveries</h2>
            </div>
            <div id="deliveryList" class="stack"></div>
          </section>
        </aside>

        <section class="stage card">
          <div class="card-head stage-head">
            <div>
              <h2>Map</h2>
            </div>
            <div class="location-summary" id="locationSummary">No delivery selected</div>
          </div>

          <div id="map" class="map"></div>

          <div class="editor-grid">
            <label class="field compact">
              <span>Live latitude</span>
              <input id="liveLat" type="number" step="0.000001" placeholder="43.731500" />
            </label>
            <label class="field compact">
              <span>Live longitude</span>
              <input id="liveLng" type="number" step="0.000001" placeholder="-79.762400" />
            </label>
            <button class="primary-button wide" id="pushLocationButton" type="button">Push live location</button>
          </div>

          <div class="log-panel">
            <div class="log-title">Log</div>
            <div id="activityLog" class="log-stack"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="./config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
